<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunny Café</title>
</head>
<body style="margin:0; font-family:Arial,sans-serif; color:#263238; background:#fff8ee;">
  <header style="padding:20px; text-align:center; background:#ffffff;">
    <h2 style="margin:0; color:#c86135;">Sunny Café</h2>
  </header>

  <main style="min-height:65vh; display:flex; align-items:center; justify-content:center; padding:30px; text-align:center; background:#ffe8c9;">
    <section>
      <h1 style="font-size:48px; margin:0 0 12px;">A brighter kind of coffee</h1>
      <p style="font-size:18px; color:#58656a;">Fresh coffee, warm pastries, and a cozy place to unwind.</p>
      <a href="#about" style="display:inline-block; margin-top:12px; padding:12px 22px; border-radius:6px; background:#c86135; color:white; text-decoration:none;">Discover our café</a>

  </main>

  <section id="about" style="padding:40px 20px; text-align:center;">
    <h2>Good days start here</h2>
    <p style="max-width:500px; margin:auto; color:#58656a;">Stop by for your favorite cup and something delicious, made fresh every day.</p>
  </section>

  <footer style="padding:16px; text-align:center; color:#687378; background:#ffffff;">
    © 2026 Sunny Café · Open daily, 8am–6pm
  </footer>
